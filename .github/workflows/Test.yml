name: Meraki API Test Connection

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests

          
      - name: Run Meraki Diagnostic Test
        env:
          MERAKI_API_KEY: ${{ secrets.MERAKI_API_KEY }}
          MERAKI_NETWORK_ID: ${{ secrets.MERAKI_NETWORK_ID }}
          MERAKI_ORGANIZATION_ID: ${{ secrets.MERAKI_ORGANIZATION_ID }}
          PYTHONUNBUFFERED: "1"
        shell: python
        run: |
          import os
          import requests

          api_key = os.environ.get("MERAKI_API_KEY")
          org_id = os.environ.get("MERAKI_ORGANIZATION_ID")
          net_id = os.environ.get("MERAKI_NETWORK_ID")

          headers = {
              "X-Cisco-Meraki-API-Key": api_key,
              "Content-Type": "application/json"
          }

          print("--- 1. Fetching All Accessible Organizations ---", flush=True)
          try:
              r = requests.get("https://api.meraki.com/api/v1/organizations", headers=headers, timeout=30)
              r.raise_for_status()
              orgs = r.json()
              print(f"Total organizations found: {len(orgs)}", flush=True)
              for o in orgs:
                  print(f"Organization Name: {o.get('name')} | ID: {o.get('id')}", flush=True)
          except Exception as e:
              print(f"Failed to fetch organizations: {e}", flush=True)

          if org_id:
              print(f"\n--- 2. Checking Networks in Org ID: {org_id} ---", flush=True)
              try:
                  r = requests.get(f"https://api.meraki.com/api/v1/organizations/{org_id}/networks", headers=headers, timeout=30)
                  r.raise_for_status()
                  networks = r.json()
                  print(f"Total networks found in this org: {len(networks)}", flush=True)
                  for n in networks:
                      is_match = " [MATCHES SECRET]" if n.get('id') == net_id else ""
                      print(f"Network Name: {n.get('name')} | ID: {n.get('id')}{is_match}", flush=True)
              except Exception as e:
                  print(f"Failed to fetch networks for this org: {e}", flush=True)

              print(f"\n--- 3. Checking Existing Policy Objects in Org ID: {org_id} ---", flush=True)
              try:
                  r = requests.get(f"https://api.meraki.com/api/v1/organizations/{org_id}/policyObjects?perPage=10", headers=headers, timeout=30)
                  r.raise_for_status()
                  objs = r.json()
                  print(f"Found {len(objs)} objects in this org (showing first 10):", flush=True)
                  for o in objs[:10]:
                      print(f"Object Name: {o.get('name')} | CIDR: {o.get('cidr')}", flush=True)
              except Exception as e:
                  print(f"Failed to fetch policy objects: {e}", flush=True)
