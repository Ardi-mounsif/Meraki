name: Meraki Single Object Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests

          
      - name: Test Single Object Creation
        env:
          MERAKI_API_KEY: ${{ secrets.MERAKI_API_KEY }}
          MERAKI_ORGANIZATION_ID: ${{ secrets.MERAKI_ORGANIZATION_ID }}
          PYTHONUNBUFFERED: "1"
        shell: python
        run: |
          import os
          import requests

          api_key = os.environ.get("MERAKI_API_KEY")
          org_id = os.environ.get("MERAKI_ORGANIZATION_ID")

          headers = {
              "X-Cisco-Meraki-API-Key": api_key,
              "Content-Type": "application/json"
          }

          payload = {
              "name": "CS_Test_Object",
              "type": "network",
              "category": "network",
              "cidr": "1.1.1.1/32"
          }

          url = f"https://api.meraki.com/api/v1/organizations/{org_id}/policyObjects"
          
          print("Testing single object creation...", flush=True)
          r = requests.post(url, headers=headers, json=payload, timeout=30)
          print(f"Status Code: {r.status_code}", flush=True)
          print(f"Response Body: {r.text}", flush=True)
