name: Test Update DNS Only

on:
  workflow_dispatch:

jobs:
  update-dns:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Execute Script
        env:
          MERAKI_API_KEY: ${{ secrets.MERAKI_API_KEY }}
          MERAKI_ORGANIZATION_ID: ${{ secrets.MERAKI_ORGANIZATION_ID }}
        shell: python
        run: |
          import os
          import time
          import requests

          API_KEY = os.environ["MERAKI_API_KEY"]
          ORG_ID = os.environ["MERAKI_ORGANIZATION_ID"]
          NET_NAME = "MX67"

          headers = {
              "X-Cisco-Meraki-API-Key": API_KEY,
              "Content-Type": "application/json"
          }

          networks_url = f"https://api.meraki.com/api/v1/organizations/{ORG_ID}/networks"
          networks = requests.get(networks_url, headers=headers).json()
          
          net_id = None
          for net in networks:
              if net["name"] == NET_NAME:
                  net_id = net["id"]
                  break

          if not net_id:
              print(f"Network '{NET_NAME}' not found.")
              exit(1)

          print("Enabling VLANs to unlock DHCP DNS settings...")
          vlans_settings_url = f"https://api.meraki.com/api/v1/networks/{net_id}/appliance/vlans/settings"
          requests.put(vlans_settings_url, headers=headers, json={"enabled": True})
          time.sleep(5)

          print("Fetching VLANs...")
          vlans_url = f"https://api.meraki.com/api/v1/networks/{net_id}/appliance/vlans"
          vlans = requests.get(vlans_url, headers=headers).json()

          dns_payload = {
              "dnsNameservers": "custom",
              "customNameservers": ["172.64.36.1", "172.64.36.2"]
          }

          for vlan in vlans:
              vlan_id = vlan["id"]
              vlan_update_url = f"https://api.meraki.com/api/v1/networks/{net_id}/appliance/vlans/{vlan_id}"
              res = requests.put(vlan_update_url, headers=headers, json=dns_payload)
              print(f"VLAN {vlan_id} update status: {res.status_code}")
              print(f"Response: {res.text}")
