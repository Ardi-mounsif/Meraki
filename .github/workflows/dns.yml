name: Test Update DNS Only

on:
  workflow_dispatch:

jobs:
  update-dns:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Execute Script
        env:
          MERAKI_API_KEY: ${{ secrets.MERAKI_API_KEY }}
          MERAKI_ORGANIZATION_ID: ${{ secrets.MERAKI_ORGANIZATION_ID }}
        shell: python
        run: |
          import os
          import requests

          API_KEY = os.environ["MERAKI_API_KEY"]
          ORG_ID = os.environ["MERAKI_ORGANIZATION_ID"]
          NET_NAME = "MX67"

          headers = {
              "X-Cisco-Meraki-API-Key": API_KEY,
              "Content-Type": "application/json"
          }

          networks_url = f"https://api.meraki.com/api/v1/organizations/{ORG_ID}/networks"
          networks = requests.get(networks_url, headers=headers).json()
          
          net_id = None
          for net in networks:
              if net["name"] == NET_NAME:
                  net_id = net["id"]
                  break

          if not net_id:
              print(f"Network '{NET_NAME}' not found.")
              exit(1)

          dns_payload = {
              "dnsNameservers": "custom",
              "customNameservers": ["172.64.36.1", "172.64.36.2"]
          }

          vlans_url = f"https://api.meraki.com/api/v1/networks/{net_id}/appliance/vlans"
          vlans_res = requests.get(vlans_url, headers=headers)

          if vlans_res.status_code == 200:
              try:
                  vlans = vlans_res.json()
                  if isinstance(vlans, list):
                      for vlan in vlans:
                          vlan_id = vlan["id"]
                          vlan_update_url = f"https://api.meraki.com/api/v1/networks/{net_id}/appliance/vlans/{vlan_id}"
                          res = requests.put(vlan_update_url, headers=headers, json=dns_payload)
                          print(f"VLAN {vlan_id} status: {res.status_code}")
                  else:
                      raise Exception()
              except:
                  lan_url = f"https://api.meraki.com/api/v1/networks/{net_id}/appliance/singleLan"
                  res = requests.put(lan_url, headers=headers, json=dns_payload)
                  print(f"singleLan status: {res.status_code} response: {res.text}")
          else:
              lan_url = f"https://api.meraki.com/api/v1/networks/{net_id}/appliance/singleLan"
              res = requests.put(lan_url, headers=headers, json=dns_payload)
              print(f"singleLan status: {res.status_code} response: {res.text}")
