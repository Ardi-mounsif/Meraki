name: Meraki DNS Update Final

on:
  workflow_dispatch:

jobs:
  update-dns:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install meraki
      - name: Run script
        env:
          MERAKI_API_KEY: ${{ secrets.MERAKI_API_KEY }}
        shell: python
        run: |
          import meraki
          import os

          API_KEY = os.getenv("MERAKI_API_KEY")
          dashboard = meraki.DashboardAPI(API_KEY, suppress_logging=True)
          orgs = dashboard.organizations.getOrganizations()

          for org in orgs:
              networks = dashboard.organizations.getOrganizationNetworks(org['id'])
              for net in networks:
                  if net['name'] == 'MX67':
                      # 1. جيب الإعدادات الحالية
                      current = dashboard.appliance.getNetworkApplianceSingleLan(net['id'])
                      
                      # 2. التحديث مع التأكد من إدراج كافة الإعدادات الضرورية
                      dashboard.appliance.updateNetworkApplianceSingleLan(
                          net['id'],
                          subnet=current['subnet'],
                          applianceIp=current['applianceIp'],
                          dhcpHandling=current.get('dhcpHandling', 'Run a DHCP server'),
                          dhcpLeaseTime=current.get('dhcpLeaseTime', '1 day'),
                          dnsNameservers="custom",
                          dnsCustomNameservers=["1.1.1.1", "8.8.8.8"]
                      )
                      print(f"Updated Network {net['name']} with forced DNS settings")
