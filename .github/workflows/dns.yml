name: Update Meraki DNS Final Try

on:
  workflow_dispatch:

jobs:
  update-dns:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Execute Script
        env:
          MERAKI_API_KEY: ${{ secrets.MERAKI_API_KEY }}
          MERAKI_ORGANIZATION_ID: ${{ secrets.MERAKI_ORGANIZATION_ID }}
        shell: python
        run: |
          import os
          import requests

          API_KEY = os.environ["MERAKI_API_KEY"]
          ORG_ID = os.environ["MERAKI_ORGANIZATION_ID"]
          NET_NAME = "MX67"

          headers = {
              "X-Cisco-Meraki-API-Key": API_KEY,
              "Content-Type": "application/json"
          }

          networks_url = f"https://api.meraki.com/api/v1/organizations/{ORG_ID}/networks"
          networks = requests.get(networks_url, headers=headers).json()
          
          net_id = None
          for net in networks:
              if net["name"] == NET_NAME:
                  net_id = net["id"]
                  break

          if not net_id:
              print("Network not found")
              exit(1)

          lan_url = f"https://api.meraki.com/api/v1/networks/{net_id}/appliance/singleLan"
          
          payload = {
              "subnet": "192.168.128.0/24",
              "applianceIp": "192.168.128.1",
              "dnsNameservers": "custom",
              "dnsCustomNameservers": ["172.64.36.1"],
              "dhcpHandling": "Run a DHCP server",
              "dhcpLeaseTime": "1 day"
          }

          res = requests.put(lan_url, headers=headers, json=payload)
          print(f"Status: {res.status_code}, Response: {res.text}")
