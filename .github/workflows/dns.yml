name: Update Meraki Split DNS

on:
  workflow_dispatch:

jobs:
  update-split-dns:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Execute Script
        env:
          MERAKI_API_KEY: ${{ secrets.MERAKI_API_KEY }}
          MERAKI_ORGANIZATION_ID: ${{ secrets.MERAKI_ORGANIZATION_ID }}
        shell: python
        run: |
          import os
          import requests

          API_KEY = os.environ["MERAKI_API_KEY"]
          ORG_ID = os.environ["MERAKI_ORGANIZATION_ID"]
          NET_NAME = "MX67"
          PROFILE_NAME = "Custom DNS Profile"

          headers = {
              "X-Cisco-Meraki-API-Key": API_KEY,
              "Content-Type": "application/json"
          }

          networks_url = f"https://api.meraki.com/api/v1/organizations/{ORG_ID}/networks"
          networks = requests.get(networks_url, headers=headers).json()
          
          net_id = None
          for net in networks:
              if net["name"] == NET_NAME:
                  net_id = net["id"]
                  break

          if not net_id:
              print("Network not found")
              exit(1)

          profiles_url = f"https://api.meraki.com/api/v1/organizations/{ORG_ID}/appliance/dns/split/profiles"
          profiles = requests.get(profiles_url, headers=headers).json()
          
          profile_id = None
          for p in profiles:
              if p.get("name") == PROFILE_NAME:
                  profile_id = p.get("profileId")
                  break

          payload = {
              "name": PROFILE_NAME,
              "hostnames": ["*"],
              "nameservers": {
                  "addresses": ["172.64.36.1"]
              }
          }

          if profile_id:
              print("Updating existing Split DNS Profile...")
              update_url = f"{profiles_url}/{profile_id}"
              res = requests.put(update_url, headers=headers, json=payload)
          else:
              print("Creating new Split DNS Profile...")
              res = requests.post(profiles_url, headers=headers, json=payload)
              if res.status_code == 201:
                  profile_id = res.json().get("profileId")

          print(f"Profile Status: {res.status_code}")

          if profile_id:
              print("Assigning Profile to Network...")
              assign_url = f"https://api.meraki.com/api/v1/organizations/{ORG_ID}/appliance/dns/split/profiles/assignments"
              assign_payload = {
                  "assignments": [
                      {
                          "networkId": net_id,
                          "profileId": profile_id
                      }
                  ]
              }
              assign_res = requests.post(assign_url, headers=headers, json=assign_payload)
              print(f"Assignment Status: {assign_res.status_code}")
              print(f"Response: {assign_res.text}")
