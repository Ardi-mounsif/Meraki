name: Update Meraki Split DNS

on:
  workflow_dispatch:

jobs:
  update-split-dns:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Execute Script
        env:
          MERAKI_API_KEY: ${{ secrets.MERAKI_API_KEY }}
          MERAKI_ORGANIZATION_ID: ${{ secrets.MERAKI_ORGANIZATION_ID }}
        shell: python
        run: |
          import os
          import requests

          API_KEY = os.environ["MERAKI_API_KEY"]
          ORG_ID = os.environ["MERAKI_ORGANIZATION_ID"]
          NET_NAME = "MX67"
          PROFILE_NAME = "Custom DNS Profile"

          headers = {
              "X-Cisco-Meraki-API-Key": API_KEY,
              "Content-Type": "application/json"
          }

          networks_url = f"https://api.meraki.com/api/v1/organizations/{ORG_ID}/networks"
          networks = requests.get(networks_url, headers=headers).json()
          
          net_id = None
          for net in networks:
              if net["name"] == NET_NAME:
                  net_id = net["id"]
                  break

          if not net_id:
              print("Network not found")
              exit(1)

          profiles_url = f"https://api.meraki.com/api/v1/organizations/{ORG_ID}/appliance/dns/split/profiles"
          profiles_res = requests.get(profiles_url, headers=headers)
          
          if profiles_res.status_code != 200:
              print(f"Failed to fetch profiles. Status: {profiles_res.status_code}, Response: {profiles_res.text}")
              exit(1)

          profiles_data = profiles_res.json()
          profiles = profiles_data.get("items", [])
          
          profile_id = None
          for p in profiles:
              if isinstance(p, dict) and p.get("name") == PROFILE_NAME:
                  profile_id = p.get("profileId")
                  break

          payload = {
              "name": PROFILE_NAME,
              "hostnames": ["*"],
              "nameservers": {
                  "addresses": ["172.64.36.1"]
              }
