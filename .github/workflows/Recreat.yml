name: Test Recreate Network and Set DHCP DNS via Template Bind

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 */15 * *'

jobs:
  recreate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Execute Script
        env:
          MERAKI_API_KEY: ${{ secrets.MERAKI_API_KEY }}
          MERAKI_ORGANIZATION_ID: ${{ secrets.MERAKI_ORGANIZATION_ID }}
          DEVICE_SERIAL: ${{ secrets.DEVICE_SERIAL }}
        shell: python
        run: |
          import os
          import time
          import requests

          API_KEY = os.environ["MERAKI_API_KEY"]
          ORG_ID = os.environ["MERAKI_ORGANIZATION_ID"]
          SERIAL = os.environ["DEVICE_SERIAL"]
          NET_NAME = "My-MX67-Network"
          TEMPLATE_NAME = "Me"

          headers = {
              "X-Cisco-Meraki-API-Key": API_KEY,
              "Content-Type": "application/json"
          }

          print("Fetching templates...")
          temps_url = f"https://api.meraki.com/api/v1/organizations/{ORG_ID}/configTemplates"
          templates = requests.get(temps_url, headers=headers).json()
          template = next((t for t in templates if t['name'] == TEMPLATE_NAME), None)

          if not template:
              print(f"Template '{TEMPLATE_NAME}' not found.")
              exit(1)
          
          template_id = template['id']
          print(f"Found Template ID: {template_id}")

          print("Updating DNS settings directly on the Template...")
          template_vlans_url = f"https://api.meraki.com/api/v1/networks/{template_id}/appliance/vlans"
          template_vlans = requests.get(template_vlans_url, headers=headers).json()

          dns_payload = {
              "dnsNameservers": "custom",
              "customNameservers": ["172.64.36.1", "172.64.36.2"]
          }

          if isinstance(template_vlans, list):
              for vlan in template_vlans:
                  vlan_id = vlan["id"]
                  print(f"Updating DNS for Template VLAN {vlan_id}...")
                  vlan_update_url = f"https://api.meraki.com/api/v1/networks/{template_id}/appliance/vlans/{vlan_id}"
                  requests.put(vlan_update_url, headers=headers, json=dns_payload)
          else:
              print("VLANs are not enabled on the template, trying single LAN setup...")
              single_lan_url = f"https://api.meraki.com/api/v1/networks/{template_id}/appliance/singleLan"
              requests.put(single_lan_url, headers=headers, json={"dnsNameservers": "custom", "dnsCustomNameservers": ["172.64.36.1", "172.64.36.2"]})

          print("Fetching networks...")
          networks_url = f"https://api.meraki.com/api/v1/organizations/{ORG_ID}/networks"
          networks = requests.get(networks_url, headers=headers).json()
          
          old_net_id = None
          for net in networks:
              if net["name"] == NET_NAME:
                  old_net_id = net["id"]
                  break

          if old_net_id:
              print(f"Deleting old network: {old_net_id}")
              requests.delete(f"https://api.meraki.com/api/v1/networks/{old_net_id}", headers=headers)
              time.sleep(15)

          print("Creating new network...")
          payload_create = {
              "name": NET_NAME,
              "productTypes": template['productTypes'],
              "timeZone": "Africa/Casablanca"
          }
          new_net = requests.post(networks_url, headers=headers, json=payload_create).json()
          new_net_id = new_net["id"]
          print(f"Created new network ID: {new_net_id}")
          time.sleep(10)

          print(f"Binding network {new_net_id} to template {template_id}...")
          bind_url = f"https://api.meraki.com/api/v1/networks/{new_net_id}/bind"
          bind_payload = {
              "configTemplateId": template_id,
              "autoBind": False
          }
          bind_res = requests.post(bind_url, headers=headers, json=bind_payload)
          print(f"Bind status: {bind_res.status_code}")
          time.sleep(10)

          print(f"Claiming device {SERIAL}...")
          claim_url = f"https://api.meraki.com/api/v1/networks/{new_net_id}/devices/claim"
          requests.post(claim_url, headers=headers, json={"serials": [SERIAL]})
          print("Execution completed successfully.")
