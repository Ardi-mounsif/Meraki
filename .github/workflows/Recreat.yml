name: Recreate and Bind with Debug

on:
  workflow_dispatch:

jobs:
  recreate-and-bind:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Execute Script
        env:
          MERAKI_API_KEY: ${{ secrets.MERAKI_API_KEY }}
          MERAKI_ORGANIZATION_ID: ${{ secrets.MERAKI_ORGANIZATION_ID }}
          DEVICE_SERIAL: ${{ secrets.DEVICE_SERIAL }}
        shell: python
        run: |
          import os
          import time
          import requests
          import json

          API_KEY = os.environ["MERAKI_API_KEY"]
          ORG_ID = os.environ["MERAKI_ORGANIZATION_ID"]
          SERIAL = os.environ["DEVICE_SERIAL"]
          NET_NAME = "MX67"
          TEMPLATE_NAME = "Me"

          headers = {
              "X-Cisco-Meraki-API-Key": API_KEY,
              "Content-Type": "application/json"
          }

          # 1. جيب الـ ID ديال التمبليت
          temps_url = f"https://api.meraki.com/api/v1/organizations/{ORG_ID}/configTemplates"
          response = requests.get(temps_url, headers=headers)
          if response.status_code != 200:
              print(f"Error fetching templates: {response.text}")
              exit(1)
              
          templates = response.json()
          template = next((t for t in templates if t['name'] == TEMPLATE_NAME), None)
          
          if not template:
              print(f"Template '{TEMPLATE_NAME}' not found.")
              exit(1)
          
          template_id = template['id']
          print(f"Found Template ID: {template_id}")

          # 2. حذف النيتورك القديمة
          networks_url = f"https://api.meraki.com/api/v1/organizations/{ORG_ID}/networks"
          networks = requests.get(networks_url, headers=headers).json()
          for net in networks:
              if net["name"] == NET_NAME:
                  print(f"Deleting network: {net['id']}")
                  requests.delete(f"https://api.meraki.com/api/v1/networks/{net['id']}", headers=headers)
                  time.sleep(10)

          # 3. إنشاء نيتورك جديدة
          payload_create = {
              "name": NET_NAME, 
              "productTypes": template['productTypes'], 
              "timeZone": "Africa/Casablanca"
          }
          new_net = requests.post(networks_url, headers=headers, json=payload_create).json()
          new_net_id = new_net["id"]
          print(f"Created network with ID: {new_net_id}")
          time.sleep(5)

          # 4. الربط بالتمبليت مع Debug
          bind_url = f"https://api.meraki.com/api/v1/organizations/{ORG_ID}/networks/bind"
          bind_payload = {
              "networkIds": [new_net_id],
              "configTemplateId": template_id
          }
          
          print(f"DEBUG URL: {bind_url}")
          print(f"DEBUG Payload: {json.dumps(bind_payload)}")
          
          res = requests.post(bind_url, headers=headers, json=bind_payload)
          
          if res.status_code == 200:
              print("Network successfully bound.")
          else:
              print(f"Failed to bind. Status code: {res.status_code}")
              print(f"Response: {res.text}")
              exit(1)
          
          # 5. إضافة الجهاز
          claim_url = f"https://api.meraki.com/api/v1/networks/{new_net_id}/devices/claim"
          requests.post(claim_url, headers=headers, json={"serials": [SERIAL]})
          print("Device claimed.")
