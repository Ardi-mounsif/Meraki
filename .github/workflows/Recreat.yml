name: Recreate and Configure Template DNS

on:
  workflow_dispatch:

jobs:
  configure-and-bind:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Execute Script
        env:
          MERAKI_API_KEY: ${{ secrets.MERAKI_API_KEY }}
          MERAKI_ORGANIZATION_ID: ${{ secrets.MERAKI_ORGANIZATION_ID }}
          DEVICE_SERIAL: ${{ secrets.DEVICE_SERIAL }}
        shell: python
        run: |
          import os
          import time
          import requests

          API_KEY = os.environ["MERAKI_API_KEY"]
          ORG_ID = os.environ["MERAKI_ORGANIZATION_ID"]
          SERIAL = os.environ["DEVICE_SERIAL"]
          NET_NAME = "MX67"
          TEMPLATE_NAME = "Me"

          headers = {
              "X-Cisco-Meraki-API-Key": API_KEY,
              "Content-Type": "application/json"
          }

          # 1. جيب الـ ID ديال التمبليت
          temps_url = f"https://api.meraki.com/api/v1/organizations/{ORG_ID}/configTemplates"
          templates = requests.get(temps_url, headers=headers).json()
          template_id = next((t['id'] for t in templates if t['name'] == TEMPLATE_NAME), None)

          if not template_id:
              print("Template 'Me' not found.")
              exit(1)

          # 2. بدل الـ DNS ف التمبليت مباشرة
          dns_payload = {
              "dnsNameservers": "custom",
              "dnsCustomNameservers": ["1.1.1.1", "1.0.0.1"]
          }
          template_lan_url = f"https://api.meraki.com/api/v1/networks/{template_id}/appliance/singleLan"
          requests.put(template_lan_url, headers=headers, json=dns_payload)
          print("Template DNS updated.")

          # 3. حذف النيتورك القديمة
          networks_url = f"https://api.meraki.com/api/v1/organizations/{ORG_ID}/networks"
          networks = requests.get(networks_url, headers=headers).json()
          for net in networks:
              if net["name"] == NET_NAME:
                  requests.delete(f"https://api.meraki.com/api/v1/networks/{net['id']}", headers=headers)
                  time.sleep(15)

          # 4. إنشاء نيتورك جديدة
          payload_create = {"name": NET_NAME, "productTypes": ["appliance"], "timeZone": "Africa/Casablanca"}
          new_net = requests.post(networks_url, headers=headers, json=payload_create).json()
          new_net_id = new_net["id"]

          # 5. ربط النيتورك بالتمبليت
          bind_url = f"https://api.meraki.com/api/v1/organizations/{ORG_ID}/networks/bind"
          requests.post(bind_url, headers=headers, json={"networkIds": [new_net_id], "configTemplateId": template_id})
          
          # 6. إضافة الجهاز
          claim_url = f"https://api.meraki.com/api/v1/networks/{new_net_id}/devices/claim"
          requests.post(claim_url, headers=headers, json={"serials": [SERIAL]})
          
          print("Network created, bound to template, and DNS settings inherited.")
