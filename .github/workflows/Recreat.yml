name: Test Recreate Network and Set DNS Local Profile

on:
  workflow_dispatch:

jobs:
  recreate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Execute Script
        env:
          MERAKI_API_KEY: ${{ secrets.MERAKI_API_KEY }}
          MERAKI_ORGANIZATION_ID: ${{ secrets.MERAKI_ORGANIZATION_ID }}
          DEVICE_SERIAL: ${{ secrets.DEVICE_SERIAL }}
        shell: python
        run: |
          import os
          import time
          import requests

          API_KEY = os.environ["MERAKI_API_KEY"]
          ORG_ID = os.environ["MERAKI_ORGANIZATION_ID"]
          SERIAL = os.environ["DEVICE_SERIAL"]
          NET_NAME = "MX67"
          PROFILE_NAME = "My-DNS-Local-Profile"

          headers = {
              "X-Cisco-Meraki-API-Key": API_KEY,
              "Content-Type": "application/json"
          }

          print("Fetching networks...")
          networks_url = f"https://api.meraki.com/api/v1/organizations/{ORG_ID}/networks"
          networks = requests.get(networks_url, headers=headers).json()
          
          old_net_id = None
          for net in networks:
              if net["name"] == NET_NAME:
                  old_net_id = net["id"]
                  break

          if old_net_id:
              print(f"Deleting network: {old_net_id}")
              requests.delete(f"https://api.meraki.com/api/v1/networks/{old_net_id}", headers=headers)
              time.sleep(15)

          print("Creating new network...")
          payload_create = {
              "name": NET_NAME,
              "productTypes": ["appliance"],
              "timeZone": "Africa/Casablanca"
          }
          new_net = requests.post(networks_url, headers=headers, json=payload_create).json()
          new_net_id = new_net["id"]

          print(f"Claiming device {SERIAL}...")
          claim_url = f"https://api.meraki.com/api/v1/networks/{new_net_id}/devices/claim"
          requests.post(claim_url, headers=headers, json={"serials": [SERIAL]})
          time.sleep(30)

          print("Fetching DNS local profiles...")
          profiles_url = f"https://api.meraki.com/api/v1/organizations/{ORG_ID}/appliance/dns/localProfiles"
          profiles_res = requests.get(profiles_url, headers=headers)
          
          profile_id = None
          if profiles_res.status_code == 200:
              for p in profiles_res.json():
                  if p.get("name") == PROFILE_NAME:
                      profile_id = p.get("id")
                      break

          dns_payload = {
              "name": PROFILE_NAME,
              "localNameservers": {
                  "mode": "custom",
                  "customNameservers": ["172.64.36.1", "172.64.36.2"]
              }
          }

          if profile_id:
              print(f"Updating existing DNS profile {profile_id}...")
              update_url = f"https://api.meraki.com/api/v1/organizations/{ORG_ID}/appliance/dns/localProfiles/{profile_id}"
              dns_res = requests.put(update_url, headers=headers, json=dns_payload)
          else:
              print("Creating new DNS profile...")
              dns_res = requests.post(profiles_url, headers=headers, json=dns_payload)

          print(f"DNS Profile API Status Code: {dns_res.status_code}")
          print(f"DNS Profile API Response: {dns_res.text}")
