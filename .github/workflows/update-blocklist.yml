name: IP Blacklist

on: 
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
   
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Fetch
      run: | 
        curl -s https://raw.githubusercontent.com/LittleJake/ip-blacklist/refs/heads/main/ustc_blacklist_ip.txt > raw_fetched_ips.txt || true
        grep -E '^[0-9]' raw_fetched_ips.txt | grep -v ':' | sort -u > all_blacklist_append.txt || true
        
        if [ ! -s all_blacklist_append.txt ]; then
          echo "1.1.1.1/32" > all_blacklist_append.txt
        fi

        gzip -c all_blacklist_append.txt > all_blacklist_append.txt.gz
        rm -f raw_fetched_ips.txt

    - name: Push to Cisco Meraki API
      env:
        MERAKI_API_KEY: ${{ secrets.MERAKI_API_KEY }}
        MERAKI_ORG_ID: ${{ secrets.MERAKI_ORG_ID }}
      run: |
        split -l 1000 all_blacklist_append.txt part_ips_ --numeric-suffixes=1

        # جلب المجموعات الحالية من الـ networkObjects
        EXISTING_GROUPS=$(curl -s -H "X-Cisco-Meraki-API-Key: $MERAKI_API_KEY" "https://api.meraki.com/api/v1/organizations/$MERAKI_ORG_ID/networkObjects/groups")

        for file in part_ips_*; do
          suffix="${file##*_}"
          group_name="CrowdSec_Blocklist_Part_${suffix}"
          
          echo "Processing $group_name with $(wc -l < $file) IPs..."

          # بناء الـ Payload مع ضبط مصفوفة الـ objects بالبنية الرسمية لـ Meraki
          JSON_PAYLOAD=$(jq -n --arg name "$group_name" '{"name": $name, "networkIds": [], "objects": []}')

          while IFS= read -r ip || [ -n "$ip" ]; do
            if [[ ! "$ip" == *"/"* ]]; then
              val="$ip/32"
            else
              val="$ip"
            fi
            # تحديد الـ name والـ value والـ type لكل عنصر بشكل صحيح باش يتعرف عليه السيستم ويتحسب ف الـ Contains
            JSON_PAYLOAD=$(echo "$JSON_PAYLOAD" | jq --arg val "$val" '.objects += [{"name": $val, "type": "cidr", "value": $val}]')
          done < "$file"

          GROUP_ID="null"
          if echo "$EXISTING_GROUPS" | jq -e . >/dev/null 2>&1; then
            GROUP_ID=$(echo "$EXISTING_GROUPS" | jq -r --arg name "$group_name" '.[] | select(.name==$name) | .id' 2>/dev/null || echo "null")
          fi

          # حذف المجموعة القديمة أولاً لتفادي تكرار العناصر أو مشاكل التحديث
          if [ -n "$GROUP_ID" ] && [ "$GROUP_ID" != "null" ]; then
            echo "Deleting existing group $group_name to refresh contents..."
            curl -X DELETE "https://api.meraki.com/api/v1/organizations/$MERAKI_ORG_ID/networkObjects/groups/$GROUP_ID" \
              -H "X-Cisco-Meraki-API-Key: $MERAKI_API_KEY"
          fi

          echo "Creating group $group_name via networkObjects..."
          curl -X POST "https://api.meraki.com/api/v1/organizations/$MERAKI_ORG_ID/networkObjects/groups" \
            -H "X-Cisco-Meraki-API-Key: $MERAKI_API_KEY" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d "$JSON_PAYLOAD"
        done

        rm -f all_blacklist_append.txt part_ips_*

    - name: Commit
      run: |
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"
        git add all_blacklist_append.txt.gz
        git commit -m "Update IP [skip ci]." || echo "No changes to commit"

    - name: Push changes
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: main
