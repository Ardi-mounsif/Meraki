name: Update Meraki Blocklist

on:
  schedule:
    - cron: '0 0 * * *' # كايشتغل تلقائياً كل نهار مع المنتصف ديال الليل
  workflow_dispatch: # كايسمح لك تشغل الكود بيدك وقتما بغيتي

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # تفعيل الدعم الكامل لـ Node.js 24 وحذف التحذير

jobs:
  update-meraki:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Fetch Bad IPs
      run: |
        # نحاول نجيب القائمة من الرابط الرئيسي، وإلا نستعمل رابط الاسترجاع المباشر
        curl -s https://lists.crowdsec.net/limiter/firewalls > raw-ips.txt || curl -s https://raw.githubusercontent.com/crowdsecurity/crowdsec-blocklists/main/lists/firewalls.txt > raw-ips.txt
        
        # تنظيف الملف واستخراج عناوين IP فقط مع تفادي توقف السكربت
        grep -v '^#' raw-ips.txt | grep -E '^[0-9]' > bad-ips.txt || true
        
        # التأكد من أن الملف ليس فارغاً، وإذا كان فارغاً نضع IP وهمي للحماية
        if [ ! -s bad-ips.txt ]; then
          echo "1.1.1.1" > bad-ips.txt
        fi
        
        echo "Fetched $(wc -l < bad-ips.txt) IPs"

    - name: Push to Cisco Meraki API
      env:
        MERAKI_API_KEY: ${{ secrets.MERAKI_API_KEY }}
        MERAKI_ORG_ID: ${{ secrets.MERAKI_ORG_ID }}
      run: |
        # Take the top 1000 IPs to prevent Meraki API payload size overflow
        head -n 1000 bad-ips.txt > meraki-ips.txt

        # Build the JSON payload automatically using jq tool
        JSON_PAYLOAD=$(jq -n --arg name "CrowdSec_Blocklist" --arg cat "network" \
          '{"name": $name, "category": $cat, "objects": []}')

        while IFS= read -r ip || [ -n "$ip" ]; do
          JSON_PAYLOAD=$(echo "$JSON_PAYLOAD" | jq --arg val "$ip/32" '.objects += [{"type": "cidr", "value": $val}]')
        done < meraki-ips.txt

        # Send the POST request to create the Meraki network policy object group
        curl -X POST "https://api.meraki.com/api/v1/organizations/$MERAKI_ORG_ID/policyObjects/groups" \
          -H "X-Cisco-Meraki-API-Key: $MERAKI_API_KEY" \
          -H "Content-Type: application/json" \
          -H "Accept: application/json" \
          -H "X-Cisco-Meraki-API-User-Agent: MerakiAuth" \
          -d "$JSON_PAYLOAD"

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add bad-ips.txt
        git commit -m "Update CrowdSec bad IPs list [skip ci]" || echo "No changes to commit"
        git push origin main
