name: IP Blacklist

on: 
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
   
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Fetch and Process
      run: | 
        # جلب الـ IPs
        curl -s https://raw.githubusercontent.com/LittleJake/ip-blacklist/refs/heads/main/ustc_blacklist_ip.txt > raw.txt
        grep -E '^[0-9]' raw.txt | grep -v ':' > ips.txt
        
        # تحويل لـ Subnets باش Meraki تقبلهم دفعة واحدة
        # هاد السطر كايحول IPs لـ CIDR /32
        sed 's/$/\/32/' ips.txt > cidrs.txt
        
    - name: Push to Meraki
      env:
        MERAKI_API_KEY: ${{ secrets.MERAKI_API_KEY }}
        MERAKI_ORG_ID: ${{ secrets.MERAKI_ORG_ID }}
      run: |
        # عوض نكريو 7000 object، غنكريو مجموعة وحدة ونحطو فيها الـ CIDRs كـ NetworkObjects مباشرة
        # هاد الطريقة هي اللي كتعمر خانة Contains
        
        # تحضير الـ Payload
        JSON_PAYLOAD=$(jq -n --arg name "CrowdSec_Blocklist" \
          --arg cat "network" \
          '{"name": $name, "category": $cat, "type": "cidr", "cidr": "1.1.1.1/32"}')
        
        # ملاحظة: Meraki كتفرض Limit فعدد الـ Objects. 
        # جرب هاد الطريقة لي كتعمر الـ Objects ديريكت
        curl -X POST "https://api.meraki.com/api/v1/organizations/$MERAKI_ORG_ID/policyObjects" \
             -H "X-Cisco-Meraki-API-Key: $MERAKI_API_KEY" \
             -H "Content-Type: application/json" \
             -d "$JSON_PAYLOAD"
