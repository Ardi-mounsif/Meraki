name: CrowdSec to Meraki MX67

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Sync CrowdSec IPs to Meraki
        env:
          MERAKI_API_KEY: ${{ secrets.MERAKI_API_KEY }}
          MERAKI_NETWORK_ID: ${{ secrets.MERAKI_NETWORK_ID }}
        run: |
          cat > sync.py << 'EOF'
          import os
          import ipaddress
          import requests

          BLOCKLIST_URL = "https://raw.githubusercontent.com/LittleJake/ip-blacklist/refs/heads/main/ustc_blacklist_ip.txt"

          API_KEY = os.environ["MERAKI_API_KEY"]
          NETWORK_ID = os.environ["MERAKI_NETWORK_ID"]

          headers = {
              "X-Cisco-Meraki-API-Key": API_KEY,
              "Content-Type": "application/json"
          }

          url = f"https://api.meraki.com/api/v1/networks/{NETWORK_ID}/appliance/firewall/l3FirewallRules"

          print("Fetching existing Meraki rules...")
          try:
              get_r = requests.get(url, headers=headers, timeout=120)
              get_r.raise_for_status()
              existing_rules = get_r.json().get("rules", [])
          except Exception as e:
              print(f"Error fetching rules: {e}")
              existing_rules = []

          manual_rules = [r for r in existing_rules if r.get("comment") != "CrowdSec Auto Block"]

          print("Downloading blocklist...")
          response = requests.get(BLOCKLIST_URL, timeout=120)
          response.raise_for_status()

          ips = []
          for line in response.text.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              try:
                  ips.append(ipaddress.ip_network(f"{line}/32"))
              except Exception:
                  pass

          print(f"Loaded {len(ips)} IPs")
          collapsed = list(ipaddress.collapse_addresses(ips))
          print(f"Collapsed into {len(collapsed)} CIDRs")

          MAX_RULES = 200
          new_rules = []

          for net in collapsed[:MAX_RULES]:
              new_rules.append({
                  "comment": "CrowdSec Auto Block",
                  "policy": "deny",
                  "protocol": "any",
                  "srcPort": "Any",
                  "srcCidr": str(net),
                  "destPort": "Any",
                  "destCidr": "Any",
                  "syslogEnabled": False
              })

          final_rules = new_rules + manual_rules

          print(f"Uploading {len(final_rules)} total rules to Meraki...")
          r = requests.put(
              url,
              headers=headers,
              json={"rules": final_rules},
              timeout=120
          )

          print("Status:", r.status_code)
          print(r.text)
          r.raise_for_status()
          print("Done.")
          EOF

          python sync.py
